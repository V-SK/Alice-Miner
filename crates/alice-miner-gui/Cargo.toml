[package]
name = "alice-miner-gui"
version = "0.6.8"
edition = "2021"

# The Alice Miner desktop app (the product): an eframe/egui binary on the SAME
# stack the Wallet ships (PLAN §2.1, D-stack). M1b implements the LOCKED visual
# contract (docs/design/mockup.html): frameless dark window + custom titlebar,
# the left icon rail, the "Alice Core" hero (orb + conic hashrate gauge + glowing
# Alice mark), onboarding, Home (one-click Start/Stop), and a minimal Dashboard —
# all driven by the UI-agnostic `alice-miner-core` engine.

[[bin]]
name = "alice-miner-gui"
path = "src/main.rs"

[dependencies]
alice-miner-core = { path = "../alice-miner-core" }

# Same eframe/egui feature set as the Wallet (PLAN §2.1) so the ported theme +
# frameless-window chrome behave identically — PLUS the `wgpu` backend compiled
# in alongside `glow`. Both backends are linked so the renderer can be chosen at
# runtime (see `src/platform.rs`): `glow` (OpenGL) stays the default for local
# sessions; a genuine Windows RDP / Terminal Services session auto-switches to
# `wgpu` (DX12/DX11 + WARP), which survives remote desktops where OpenGL
# white-screens. Mirror tools (DeskIn / AnyDesk / TeamViewer) aren't flagged by
# SM_REMOTESESSION, so those users set ALICE_GUI_RENDERER=wgpu manually (a runtime
# software-GL probe is the backstop). Adds ~20 transitive crates (wgpu/naga/
# egui-wgpu), measured 2026-07-16 — an acceptable cost for the primary
# remote-desktop fix.
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11"] }
egui_extras = { version = "0.34.1", features = ["svg", "image"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
# SVG → texture for the OS window icon (the Alice mark), matching the Wallet's
# `load_icon`. The hero's in-orb mark uses the bundled PNG via egui_extras.
resvg = "0.37"
usvg = "0.37"
tiny-skia = "0.11"
# Wipe the GUI password buffers on clear (audit U-2). Already in the tree via
# alice-crypto / alice-miner-core, so no new transitive crates.
zeroize = "1.8.2"
# Resolve the OS data-local dir for the GUI startup log (renderer choice / init
# failures — see `src/platform.rs`). Already in the tree via `alice-miner-core`,
# so this adds no new transitive crate.
dirs = "5.0.1"
# Deserialize the CLI→GUI telemetry snapshot file the desktop app polls while the
# headless CLI mines in a visible terminal (see `app::poll_terminal_telemetry`).
# Already in the tree via `alice-miner-core`, so this adds no new transitive crate.
serde_json = "1.0"
