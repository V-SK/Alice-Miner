[package]
name = "alice-release"
version = "0.6.4"
edition = "2021"

# Signed self-update kernel shared with the Alice Wallet. `src/lib.rs` is the
# Wallet's `gui/src/update.rs` copied with exactly two edits:
#   * `PRODUCT` is "alice-miner" (the manifest `product` field that isolates this
#     app's releases from the Wallet's, verified against the SAME embedded
#     ed25519 key `RELEASE_PUBKEY_B64`); and
#   * an inlined `config` module + test `TEST_ENV_LOCK` replacing the wallet-only
#     `crate::config::*` references (data-dir safety guard), copied byte-identical
#     from the Wallet so the no-write-into-keystore invariant is unchanged.
# Dependency versions match the Wallet's `gui/Cargo.toml`.

[dependencies]
base64 = "0.22.1"
dirs = "5.0.1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip"] }

# OS trust-store TLS verification. ureq's default rustls config trusts ONLY the
# baked-in Mozilla `webpki-roots` bundle, which ignores the OS trust store where a
# corporate SSL-inspection / antivirus HTTPS-scanning proxy installs its own root
# CA. On such Windows machines every HTTPS GET (engine download, dashboard, enroll)
# fails with `invalid peer certificate: UnknownIssuer`. Routing every ureq agent
# through the platform verifier delegates chain validation to the OS (Windows
# CryptoAPI / macOS SecTrust / Linux native roots) so the inspection CA is honored
# exactly as the browser/OS already trusts it. See `tls::os_trust_config`. Pinned
# to the SAME rustls (via ureq's re-export) so no second rustls is linked.
rustls-platform-verifier = "0.5"
